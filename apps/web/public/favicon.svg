<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  {/* Background */}
  <circle cx="50" cy="50" r="48" fill="#020617"/>
  
  {/* Outer burst */}
  <g opacity="0.6">
    <ellipse cx="50" cy="50" rx="8" ry="35" stroke="#C6A96B" stroke-width="1" fill="none" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="50" rx="8" ry="35" stroke="#C6A96B" stroke-width="1" fill="none" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="50" rx="8" ry="35" stroke="#C6A96B" stroke-width="1" fill="none" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="50" rx="8" ry="35" stroke="#C6A96B" stroke-width="1" fill="none" transform="rotate(135 50 50)"/>
  </g>
  
  {/* Inner burst */}
  <g opacity="0.4">
    <ellipse cx="50" cy="50" rx="6" ry="25" stroke="#6D8FC7" stroke-width="0.8" fill="none" transform="rotate(22.5 50 50)"/>
    <ellipse cx="50" cy="50" rx="6" ry="25" stroke="#6D8FC7" stroke-width="0.8" fill="none" transform="rotate(67.5 50 50)"/>
    <ellipse cx="50" cy="50" rx="6" ry="25" stroke="#6D8FC7" stroke-width="0.8" fill="none" transform="rotate(112.5 50 50)"/>
    <ellipse cx="50" cy="50" rx="6" ry="25" stroke="#6D8FC7" stroke-width="0.8" fill="none" transform="rotate(157.5 50 50)"/>
  </g>

  {/* Center circles */}
  <circle cx="50" cy="50" r="15" fill="#020617" stroke="#C6A96B" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="12" stroke="#D9BC82" stroke-width="1" opacity="0.8"/>
  
  {/* The 'P' */}
  <text x="50" y="58" font-family="Cinzel, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#F8F6F1">P</text>
  
  {/* Floating dots */}
  <circle cx="50" cy="38" r="1.2" fill="#C6A96B" opacity="0.8"/>
  <circle cx="62" cy="50" r="1.2" fill="#C6A96B" opacity="0.8"/>
  <circle cx="50" cy="62" r="1.2" fill="#C6A96B" opacity="0.8"/>
  <circle cx="38" cy="50" r="1.2" fill="#C6A96B" opacity="0.8"/>
</svg>
