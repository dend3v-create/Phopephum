<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rhythmic gradients for Astral Imperial Flow -->
    <radialGradient id="aura-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A96B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4B6FAE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F1"/>
      <stop offset="30%" stop-color="#D9BC82"/>
      <stop offset="70%" stop-color="#C6A96B"/>
      <stop offset="100%" stop-color="#9C8042"/>
    </linearGradient>

    <linearGradient id="mystic-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#345285"/>
      <stop offset="50%" stop-color="#4B6FAE"/>
      <stop offset="100%" stop-color="#8DA9D6"/>
    </linearGradient>

    <filter id="premium-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep cosmic background -->
  <circle cx="50" cy="50" r="48" fill="#020617" stroke="url(#gold-grad)" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="46" fill="url(#aura-glow)"/>

  <!-- Outer burst - Golden orbits representing Taksa and 8 directions -->
  <g opacity="0.75" filter="url(#premium-glow)">
    <ellipse cx="50" cy="50" rx="7.5" ry="36" stroke="url(#gold-grad)" stroke-width="1.2" fill="none" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="50" rx="7.5" ry="36" stroke="url(#gold-grad)" stroke-width="1.2" fill="none" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="50" rx="7.5" ry="36" stroke="url(#gold-grad)" stroke-width="1.2" fill="none" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="50" rx="7.5" ry="36" stroke="url(#gold-grad)" stroke-width="1.2" fill="none" transform="rotate(135 50 50)"/>
  </g>
  
  <!-- Inner burst - Mystic blue alignments -->
  <g opacity="0.55">
    <ellipse cx="50" cy="50" rx="5.5" ry="26" stroke="url(#mystic-grad)" stroke-width="0.9" fill="none" transform="rotate(22.5 50 50)"/>
    <ellipse cx="50" cy="50" rx="5.5" ry="26" stroke="url(#mystic-grad)" stroke-width="0.9" fill="none" transform="rotate(67.5 50 50)"/>
    <ellipse cx="50" cy="50" rx="5.5" ry="26" stroke="url(#mystic-grad)" stroke-width="0.9" fill="none" transform="rotate(112.5 50 50)"/>
    <ellipse cx="50" cy="50" rx="5.5" ry="26" stroke="url(#mystic-grad)" stroke-width="0.9" fill="none" transform="rotate(157.5 50 50)"/>
  </g>

  <!-- Center circles of wisdom -->
  <circle cx="50" cy="50" r="14.5" fill="#020617" stroke="url(#gold-grad)" stroke-width="0.75"/>
  <circle cx="50" cy="50" r="11.5" stroke="url(#gold-grad)" stroke-width="1.2" opacity="0.9" filter="url(#premium-glow)"/>
  
  <!-- The Cinzel 'P' with luxurious drop-shadow and gradient fill -->
  <text x="50" y="57" font-family="'Cinzel', serif" font-size="20" font-weight="bold" text-anchor="middle" fill="url(#gold-grad)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.8))">P</text>
  
  <!-- Auspicious points of the 4 cardinal directions -->
  <circle cx="50" cy="37" r="1.5" fill="url(#gold-grad)" opacity="0.9"/>
  <circle cx="63" cy="50" r="1.5" fill="url(#gold-grad)" opacity="0.9"/>
  <circle cx="50" cy="63" r="1.5" fill="url(#gold-grad)" opacity="0.9"/>
  <circle cx="37" cy="50" r="1.5" fill="url(#gold-grad)" opacity="0.9"/>
</svg>
