name: "Deploy — Production (Cloudflare Worker & Pages)"

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_worker:
        description: "Skip AI Worker deploy (Pages only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-flight-gates:
    name: "Pre-Flight: Gates 1-5 Quality & Financial Assurance"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📦 Install PNPM"
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: "⚙️ Setup Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "📥 Install Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🛡️ Gate 1: Code Quality & Linting"
        run: pnpm lint

      - name: "🛡️ Gate 2: Full Monorepo Typecheck (8 Packages)"
        run: pnpm typecheck

      - name: "🛡️ Gate 3: Engine Unit Tests"
        run: pnpm test

      - name: "🏛️ Gate 4: Financial & Economic Invariants Gate"
        run: pnpm exec tsx scripts/ci-gate-financial-regression.ts

      - name: "🔨 Gate 5: Production Monorepo Build"
        run: pnpm build

      - name: "💾 Upload Built Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: apps/web/build/
          retention-days: 1

  deploy-worker:
    name: "Deploy: Cloudflare AI Proxy Worker"
    needs: [pre-flight-gates]
    if: ${{ !inputs.skip_worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📦 Install PNPM"
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: "⚙️ Setup Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "📥 Install Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "☁️ Deploy Worker (wrangler deploy)"
        working-directory: infrastructure/workers/ai-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  deploy-pages:
    name: "Deploy: Cloudflare Pages Web App"
    needs: [pre-flight-gates, deploy-worker]
    if: always() && (needs.pre-flight-gates.result == 'success') && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📦 Install PNPM"
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: "⚙️ Setup Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "📥 Install Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "📥 Download Built Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: web-build-artifacts
          path: apps/web/build/

      - name: "☁️ Deploy to Cloudflare Pages (Production)"
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy build/client \
            --project-name=phopephum-web \
            --branch=phopephum \
            --commit-dirty=true

  post-deploy-verification:
    name: "Gate 7: Live Post-Deployment Telemetry Verification"
    needs: [deploy-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📦 Install PNPM"
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: "⚙️ Setup Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "📥 Install Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "⏳ Edge Propagation Delay (10s)"
        run: sleep 10

      - name: "🏥 Gate 7: Verify Production Health & Latency SLAs"
        env:
          TARGET_DEPLOY_URL: "https://phopephum.com"
        run: pnpm exec tsx scripts/ci-post-deploy-verify.ts --url https://phopephum.com
